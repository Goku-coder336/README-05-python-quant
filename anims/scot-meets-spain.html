<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Glasgow Meets Seville</title>
  <style>
    html, body { margin: 0; background: #111; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- 9:16, 1080x1920, 30 fps. Duration matches timing.js (generated by make_voice.py). -->
  <div id="main" data-composition-id="main" data-start="0" data-duration="23.64" data-width="1080" data-height="1920">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <audio id="dialogue" class="clip" src="../assets/audio/scot-meets-spain/dialogue.wav" data-start="0" data-track-index="2" data-volume="1"></audio>
  </div>

  <script src="shared/ladies.js"></script>
  <script src="scot-meets-spain/timing.js"></script>
  <script>
  (function () {
    const L = window.Ladies, T = window.SCENE_TIMING;
    const { clamp, lerp, seg, easeOut, easeInOut, easeBack } = L;
    const ctx = document.getElementById("stage").getContext("2d");
    const line = Object.fromEntries(T.lines.map((l) => [l.id, l]));
    const GROUND = 1630, S = 1.12;
    const SAFE = { x0: 60, x1: 960, y0: 250, y1: 1500 };

    // Where each bubble sits (all text inside the safe zone).
    const BUBBLE = {
      morag:  { x: 70,  w: 620, bottom: 690, minTop: 420, who: "morag",  accent: "#005eb8" },
      carmen: { x: 330, w: 620, bottom: 690, minTop: 420, who: "carmen", accent: "#c60b1e" },
      l7:     { x: 80,  w: 330, bottom: 700, minTop: 420, who: "morag",  accent: "#005eb8" },
      l8:     { x: 600, w: 300, bottom: 610, minTop: 420, who: "carmen", accent: "#c60b1e" },
    };

    const inLine = (id, t, pre = 0, post = 0) => t >= line[id].start - pre && t <= line[id].end + post;
    const speaking = (who, t) => T.lines.find((l) => l.who === who && t >= l.start && t <= l.end);
    function mouthOf(who, t) {
      const l = speaking(who, t); if (!l) return 0;
      const v = l.env[Math.min(l.env.length - 1, Math.floor((t - l.start) * 30))] || 0;
      return v < 0.12 ? 0.08 : v;
    }
    const blink = (t, off) => { const p = (t + off) % 3.4; return p < 0.14 ? Math.sin((p / 0.14) * Math.PI) : 0; };
    // smooth window: 0 before a, 1 between a+r and b, back to 0 by b+r
    const win = (t, a, b, r = 0.25) => Math.min(seg(t, a, a + r), 1 - seg(t, b, b + r));

    function moragState(t) {
      const enter = easeOut(seg(t, 0.1, 1.3));
      const close = easeInOut(seg(t, 19.6, 20.3));
      let x = lerp(-280, 285, enter) + 45 * close;
      const walk = (1 - seg(t, 1.1, 1.3)) * Math.abs(Math.sin(t * 11)) * 16;
      const cold = win(t, line.l3.start, line.l3.end + 0.2, 0.1);
      x += Math.sin(t * 95) * 6 * cold;
      let brow = "neutral", smile = "smile";
      if (inLine("l1", t, 0, 0.3) || inLine("l5", t, 0, 0.3)) brow = "happy";
      if (inLine("l3", t, 0, 0.3)) { brow = "cold"; smile = "flat"; }
      for (const id of ["l2", "l4"]) if (inLine(id, t, -0.3, 0.3)) { brow = "confused"; smile = "wavy"; }
      if (t > line.l6.start + 0.3 && t < line.l7.start) { brow = "confused"; smile = "o"; }
      if (t >= line.l7.start) { brow = t < line.l8.end ? "polite" : "happy"; smile = "smile"; }
      const nod = t >= line.l7.start ? Math.sin((t - line.l7.start) * 13) * 12 * (1 - seg(t, line.l7.start + 1.4, line.l7.start + 1.8)) : 0;
      const happyBob = t > 20.3 ? Math.sin(t * 7) * 6 : 0;
      return {
        x, y: GROUND - walk, p: {
          t, mouth: mouthOf("morag", t), blink: blink(t, 0.4), lookX: 1, brow, smile,
          armUp: win(t, line.l1.start, line.l1.end, 0.25) + win(t, line.l3.start, line.l3.end, 0.2),
          cup: easeBack(seg(t, line.l5.start + 0.2, line.l5.start + 0.55)) * (1 - seg(t, 19.2, 19.5)),
          headDy: nod + happyBob, tilt: t > 20.3 ? Math.sin(t * 3.5) * 0.03 : 0,
        },
      };
    }

    function carmenState(t) {
      const enter = easeOut(seg(t, 0.25, 1.45));
      const close = easeInOut(seg(t, 19.6, 20.3));
      const x = lerp(1360, 770, enter) - 45 * close;
      const walk = (1 - seg(t, 1.25, 1.45)) * Math.abs(Math.sin(t * 11 + 1)) * 16;
      let brow = "neutral", smile = "smile";
      for (const id of ["l1", "l3"]) if (inLine(id, t, -0.4, 0.3)) { brow = "confused"; smile = "wavy"; }
      if (inLine("l2", t, 0, 0.3)) brow = "confused";
      if (inLine("l4", t, 0, 0.3)) brow = "happy";
      if (inLine("l5", t, -0.5, 0.3)) { brow = "shock"; smile = "o"; }
      if (inLine("l6", t, 0, 0)) brow = t < line.l6.start + 0.8 ? "shock" : "happy";
      if (t > line.l6.end && t < line.l7.start) brow = "happy";
      if (t >= line.l7.start) brow = "happy";
      const nod = t >= line.l8.start ? Math.sin((t - line.l8.start) * 13) * 12 * (1 - seg(t, line.l8.start + 1.2, line.l8.start + 1.6)) : 0;
      const happyBob = t > 20.3 ? Math.sin(t * 7 + 1.5) * 6 : 0;
      const pt = win(t, line.l4.start + 0.5, line.l4.end + 0.1, 0.3);
      const ph = seg(t, line.l6.start + 0.7, line.l6.start + 1.05) * (1 - seg(t, line.l7.start + 0.4, line.l7.start + 0.8));
      return {
        x, y: GROUND - walk, pt, p: {
          t, mouth: mouthOf("carmen", t), blink: blink(t, 1.9), lookX: -1, brow, smile,
          fan: speaking("carmen", t) ? 1 : 0.35, point: easeOut(pt), photo: ph, headDy: nod + happyBob,
          tilt: t > 20.3 ? Math.sin(t * 3.5 + 1.5) * 0.03 : 0,
        },
      };
    }

    function meterValue(t) {
      let v = 0;
      if (inLine("l2", t)) v = 3;
      if (t > line.l4.start + 1.0) v = -5;
      if (t > line.l6.start + 0.6) v = -25;
      if (t > line.l7.start + 0.2) v = lerp(-25, 100, easeInOut(seg(t, line.l7.start + 0.2, line.l8.end)));
      if (t > 20.9) v = (t < 21.15 && Math.floor(t * 30) % 2) ? 100 : 0;
      return v;
    }

    function drawMeter(t) {
      const a = seg(t, 0.2, 0.5); if (a <= 0) return;
      const end = easeOut(seg(t, 21.1, 21.4));
      const x = 90, y = 262, w = 840, h = lerp(132, 214, end);
      ctx.save(); ctx.globalAlpha = a;
      L.rr(ctx, x + 6, y + 8, w, h, 26); ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fill();
      L.rr(ctx, x, y, w, h, 26); ctx.fillStyle = "#fffdf6"; ctx.fill(); L.outline(ctx, 6);
      const row = (ry, label, v, good) => {
        ctx.fillStyle = "#2a1d1f"; ctx.font = '900 34px Inter, "Arial Black", sans-serif';
        ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, x + 32, ry);
        ctx.textAlign = "right"; ctx.fillStyle = v < 0 ? "#c60b1e" : v >= 99 ? "#1f8a3a" : "#2a1d1f";
        ctx.fillText(`${Math.round(v)}%`, x + w - 32, ry);
        L.rr(ctx, x + 32, ry + 28, w - 64, 26, 13); ctx.fillStyle = "#e6ddd0"; ctx.fill();
        const f = clamp(v / 100);
        if (f > 0.01) { L.rr(ctx, x + 32, ry + 28, (w - 64) * f, 26, 13); ctx.fillStyle = good || v >= 60 ? "#2fb24c" : "#e0a52a"; ctx.fill(); }
        L.rr(ctx, x + 32, ry + 28, w - 64, 26, 13); L.outline(ctx, 4);
      };
      row(y + 44, "MUTUAL UNDERSTANDING", meterValue(t));
      if (end > 0) {
        ctx.globalAlpha = a * end;
        row(y + 130, "FRIENDSHIP", 100 * easeInOut(seg(t, 21.3, 22.0)), true);
      }
      ctx.restore();
    }

    function drawTitle(t) {
      const k = easeBack(seg(t, 0.15, 0.55)), out = seg(t, 1.45, 1.75);
      if (k <= 0 || out >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(510, 560); ctx.scale(k, k);
      L.rr(ctx, -400, -150, 800, 290, 36); ctx.fillStyle = "#fffdf6"; ctx.fill(); L.outline(ctx, 6);
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#2a1d1f";
      L.drawSaltire(ctx, -330, -115, 96, 64);
      L.drawSpainFlag(ctx, 234, 46, 96, 64);
      ctx.font = '900 76px Inter, "Arial Black", sans-serif'; ctx.fillText("GLASGOW", 30, -82);
      ctx.font = 'italic 700 46px Inter, Arial, sans-serif'; ctx.fillStyle = "#6b5b5e"; ctx.fillText("meets", 0, -6);
      ctx.font = '900 76px Inter, "Arial Black", sans-serif'; ctx.fillStyle = "#c60b1e"; ctx.fillText("SEVILLA", -30, 76);
      ctx.restore();
    }

    function drawBubbles(t, m, c) {
      for (const l of T.lines) {
        const lay = { ...(BUBBLE[l.id] || BUBBLE[l.who]) };
        // tail points at the speaker's head
        if (lay.who === "morag") { lay.tailX = m.x + 50; lay.tailY = m.y - 800 * S; }
        else { lay.tailX = c.x - 110; lay.tailY = c.y - 770 * S; }
        const hold = l.id === "l7" || l.id === "l8" ? 20.75 : l.end + 0.3;
        const k = easeBack(seg(t, l.start - 0.08, l.start + 0.18));
        const alpha = 1 - seg(t, hold, hold + 0.15);
        if (k > 0 && alpha > 0) L.drawBubble(ctx, { ...lay, k, alpha, text: l.text, sub: l.sub });
      }
    }

    function drawConfusion(t, m, c) {
      const moragHead = { x: m.x, y: m.y - 700 * S }, carmenHead = { x: c.x, y: c.y - 700 * S };
      const marks = (hx, hy, a, big, side) => {
        if (a <= 0) return;
        const list = big ? [[side * 150, 40, 110, "?!"]] : [[side * 145, 70, 80, "?"], [side * -150, 20, 60, "?"], [side * 175, -40, 54, "?"]];
        list.forEach(([dx, dy, size, txt], i) => {
          const bob = Math.sin(t * 6 + i * 2) * 10;
          L.drawQuestion(ctx, hx + dx, hy + dy + bob, size * easeBack(clamp(a)), Math.sin(t * 4 + i) * 0.2, clamp(a), txt);
        });
      };
      // Carmen lost while Morag talks
      for (const id of ["l1", "l3", "l5"]) marks(carmenHead.x, carmenHead.y, win(t, line[id].start + 0.5, line[id].end + 0.2, 0.2), false, 1);
      // Morag lost while Carmen talks
      for (const id of ["l2", "l4"]) marks(moragHead.x, moragHead.y, win(t, line[id].start + 0.5, line[id].end + 0.2, 0.2), false, -1);
      marks(moragHead.x, moragHead.y, win(t, line.l6.start + 1.0, line.l7.start - 0.1, 0.2), true, -1);
      // "dreich" = cheese?
      const ch = win(t, line.l2.start + 0.25, line.l2.end + 0.2, 0.2);
      if (ch > 0) {
        ctx.save(); ctx.globalAlpha = ch;
        L.circle(ctx, c.x + 95 * S, c.y - 760 * S, 10, "#fffdf6", "#2a1d1f", 4);
        L.circle(ctx, c.x + 125 * S, c.y - 800 * S, 15, "#fffdf6", "#2a1d1f", 4);
        L.circle(ctx, c.x + 160 * S, c.y - 860 * S, 62, "#fffdf6", "#2a1d1f", 5);
        L.drawCheese(ctx, c.x + 160 * S, c.y - 860 * S, 0.75 * easeBack(ch));
        ctx.restore();
      }
      // "baltic" = brrr
      const br = win(t, line.l3.start + 0.3, line.l3.end, 0.15);
      if (br > 0) {
        ctx.save(); ctx.globalAlpha = br; ctx.fillStyle = "#cfefff"; ctx.strokeStyle = "#2a1d1f"; ctx.lineWidth = 4;
        for (let i = 0; i < 6; i++) {
          const a = i * 1.05 + t * 1.5, r = 175;
          const sx = m.x + Math.cos(a) * r, sy = m.y - 640 * S + Math.sin(a) * r * 0.6;
          ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 2 + i);
          for (let j = 0; j < 3; j++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke(); }
          ctx.restore();
        }
        ctx.restore();
      }
    }

    function drawEnd(t, m, c) {
      // hearts floating up between them
      for (let i = 0; i < 7; i++) {
        const t0 = 19.8 + i * 0.35, dt = t - t0; if (dt < 0 || dt > 3) continue;
        L.drawHeart(ctx, 540 + Math.sin(dt * 3 + i) * 50 + (i % 2 ? 40 : -40), 1080 - dt * 170, 26 + (i % 3) * 6, i % 2 ? "#c60b1e" : "#005eb8", clamp(1.5 - dt * 0.6));
      }
      L.drawConfetti(ctx, 540, 960, line.l8.start + 0.05, t, 110);
      const k = easeBack(seg(t, 21.5, 21.85));
      if (k <= 0) return;
      ctx.save(); ctx.translate(510, 610); ctx.scale(k, k); ctx.rotate(-0.04);
      L.rr(ctx, -360, -78, 720, 150, 30); ctx.fillStyle = "#ffe14d"; ctx.fill(); L.outline(ctx, 6);
      ctx.fillStyle = "#2a1d1f"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = '900 66px Inter, "Arial Black", sans-serif'; ctx.fillText("Fluent in nodding.", 0, -4);
      ctx.restore();
    }

    function renderAt(t) {
      t = clamp(t, 0, T.total);
      ctx.save(); ctx.clearRect(0, 0, 1080, 1920);
      const c = carmenState(t), m = moragState(t);
      L.drawBackground(ctx, t, { signFlash: c.pt * (0.6 + 0.4 * Math.sin(t * 18)) });
      L.drawMorag(ctx, m.x, m.y, S, m.p);
      L.drawCarmen(ctx, c.x, c.y, S, c.p);
      drawConfusion(t, m, c);
      drawEnd(t, m, c);
      drawTitle(t);
      drawBubbles(t, m, c);
      drawMeter(t);
      if (window.__showSafe) { ctx.strokeStyle = "#0f0"; ctx.lineWidth = 4; ctx.setLineDash([16, 10]); ctx.strokeRect(SAFE.x0, SAFE.y0, SAFE.x1 - SAFE.x0, SAFE.y1 - SAFE.y0); ctx.setLineDash([]); }
      ctx.restore();
    }

    window.renderAt = renderAt;
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    const q = new URLSearchParams(location.search);
    window.__showSafe = q.has("safe");
    renderAt(q.has("t") ? parseFloat(q.get("t")) : 0);
  })();
  </script>
</body>
</html>
