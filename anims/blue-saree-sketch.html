<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blue Saree Sketch</title>
  <style>
    html, body { margin: 0; background: #111; }
    #main { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- Storyboard animatic, 9:16, silent. Drawn at 12 fps steps for a hand-drawn feel, rendered at 30 fps. -->
  <div id="main" data-composition-id="main" data-start="0" data-duration="16.4" data-width="1080" data-height="1920">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>
  <script src="shared/sketch-cast.js"></script>
  <script>
  (function () {
    const K = window.Sketch, { clamp, lerp, seg, ease, easeOut } = K;
    const ctx = document.getElementById("stage").getContext("2d");
    const TOTAL = 16.4;
    const blinkAt = (t, times) => times.reduce((m, b) => Math.max(m, t >= b && t < b + 0.17 ? 1 : 0), 0);

    function sheet(t) {
      K.label(ctx, "CHARACTERS");
      const breathe = Math.sin(t * 2.2) * 0.012;
      const tuck = Math.min(seg(t, 0.9, 1.3), 1 - seg(t, 2.0, 2.4));
      K.figure(ctx, { who: "meera", x: 320, ground: 1480, s: 1.3, facing: 1, t, lean: breathe,
        arms: { front: [lerp(0.15, 2.0, tuck), lerp(0.25, 2.1, tuck)], back: [0.1, 0.25] },
        pallu: { lift: 0.18, amp: 0.18 }, blink: blinkAt(t, [0.7, 2.2]), smile: "big", blush: true, tilt: tuck * 0.08 });
      const scratch = Math.min(seg(t, 1.2, 1.5), 1 - seg(t, 2.1, 2.4));
      K.figure(ctx, { who: "arjun", x: 780, ground: 1480, s: 1.3, facing: -1, t, lean: -breathe,
        arms: { front: [lerp(0.12, 2.75, scratch), lerp(0.2, 1.35, scratch) + Math.sin(t * 18) * 0.12 * scratch], back: [0.08, 0.2] },
        blink: blinkAt(t, [0.4, 1.9]), smile: scratch > 0.5 ? "big" : "", tilt: -scratch * 0.1 });
      ctx.save(); ctx.fillStyle = "rgba(58,51,45,0.85)"; ctx.textAlign = "center";
      ctx.font = '800 54px Inter, Arial, sans-serif'; ctx.fillText("MEERA", 330, 520); ctx.fillText("ARJUN", 760, 520);
      ctx.font = '500 26px Inter, Arial, sans-serif'; ctx.fillStyle = "rgba(58,51,45,0.6)";
      ctx.fillText("blue saree · jasmine · jhumka", 330, 562); ctx.fillText("curls · cream shirt · mundu", 760, 562);
      ctx.restore();
    }

    function wide(t) {
      const lt = t - 2.6;
      ctx.save(); const z = 1.22 + 0.018 * lt; ctx.translate(700, 1200); ctx.scale(z, z); ctx.translate(-700, -1200);
      K.rainStreet(ctx, t);
      K.bicycle(ctx, 960, 1470, 0.9);
      // Meera runs in from the left, slows under the awning, wipes the rain off, then they look at each other
      const runK = easeOut(seg(t, 3.6, 6.0));
      const mx = lerp(-220, 600, runK);
      const run = clamp(1 - seg(t, 5.4, 6.0)) * (t > 3.6 ? 1 : 0);
      const wipe = Math.min(seg(t, 6.1, 6.4), 1 - seg(t, 7.1, 7.4));
      const meet = seg(t, 7.4, 7.7);
      const arjunNotice = seg(t, 5.8, 6.1);
      K.figure(ctx, { who: "arjun", x: 830, ground: 1470, s: 1.0, facing: -1, t, lean: Math.sin(t * 2.2) * 0.01 - arjunNotice * 0.04,
        arms: { front: [0.1, 0.3], back: [-0.35, 0.5] }, blink: blinkAt(t, [3.5, 6.9]), wide: 1 + arjunNotice * 0.5, brow: arjunNotice * 4,
        smile: meet > 0.5 ? "big" : arjunNotice > 0.5 ? "o" : "", tilt: -arjunNotice * 0.05 });
      if (t > 3.6) K.figure(ctx, { who: "meera", x: mx, ground: 1470, s: 1.0, facing: 1, t, run, phase: mx * 0.024, lean: 0.16 * run + wipe * 0.05,
        arms: run > 0.05 ? undefined : { front: [lerp(0.15, 2.0, wipe), lerp(0.3, 2.0, wipe) + Math.sin(t * 16) * 0.15 * wipe], back: [0.1, 0.3] },
        pallu: { lift: Math.max(run, 0.15 + wipe * 0.4), amp: 0.14 + wipe * 0.3 }, blink: blinkAt(t, [6.8]), smile: meet > 0.5 ? "big" : "", blush: meet > 0.5, tilt: -meet * 0.06 });
      K.rain(ctx, t, (x, y) => x > 480 && y > lerp(830, 770, (x - 470) / 630) - 20);
      ctx.restore();
      K.label(ctx, t < 3.9 ? "1 · RAIN ON THE STREET" : "2 · SHE RUNS IN");
    }

    function bokeh(t, n = 16) {
      for (let i = 0; i < n; i++) {
        const x = K.hash(i) * 1080, y = 200 + K.hash(i + 5) * 600, r = 40 + K.hash(i + 9) * 70;
        ctx.globalAlpha = 0.18 + 0.08 * Math.sin(t * 2 + i);
        K.shape(ctx, K.ellipsePts(x, y, r, r, 14), { fill: i % 3 ? "#e8c27a" : "#9fb7c9", w: 1.4, seed: 600 + i });
      }
      ctx.globalAlpha = 1;
    }

    function hands(t) {
      bokeh(t);
      K.shape(ctx, [[-20, 1000], [1100, 960], [1100, 1940], [-20, 1940]], { fill: K.C.wood, w: 3, seed: 700 });
      for (let k = 1; k < 7; k++) K.line(ctx, [[-20, 1000 + k * 130], [1100, 960 + k * 140]], { col: K.C.soft, w: 1.6 });
      // glass of chai + steam
      K.shape(ctx, [[480, 1180], [470, 960], [610, 960], [600, 1180]], { fill: "rgba(255,255,255,0.35)", w: 3, seed: 710 });
      K.shape(ctx, [[482, 1176], [475, 1010], [605, 1010], [598, 1176]], { fill: K.C.chai, w: 2, seed: 711 });
      K.shape(ctx, K.ellipsePts(540, 1012, 64, 12, 14), { fill: "#e8d2ae", w: 2, seed: 712 });
      for (let i = 0; i < 3; i++) { const pts = []; for (let j = 0; j < 8; j++) pts.push([515 + i * 25 + Math.sin(t * 4 + j * 0.8 + i) * 12, 990 - j * 34]);
        ctx.globalAlpha = 0.5; K.line(ctx, pts, { col: K.C.soft, w: 3 }); ctx.globalAlpha = 1; }
      const k = easeOut(seg(t, 9.0, 10.3));
      // her hand (bangles) from the left, his (cream sleeve) from the right: they stop a finger apart
      const hx = lerp(80, 420, k), ax = lerp(1010, 655, k);
      K.shape(ctx, [[-60, 1260], [hx - 60, 1110], [hx - 50, 1160], [-60, 1360]], { fill: K.C.skinM, w: 3, seed: 720 });
      for (let b = 0; b < 3; b++) K.shape(ctx, K.ellipsePts(hx - 130 - b * 16, 1180 + b * 6, 12, 42, 12), { col: K.C.gold, w: 4, j: 1.5, seed: 730 + b });
      K.shape(ctx, [[hx - 70, 1105], [hx + 30, 1090], [hx + 52, 1104], [hx + 30, 1122], [hx - 30, 1168], [hx - 70, 1160]], { fill: K.C.skinM, w: 3, seed: 740 });
      K.shape(ctx, [[1140, 1320], [ax + 70, 1140], [ax + 70, 1205], [1140, 1430]], { fill: K.C.skinA, w: 3, seed: 750 });
      K.shape(ctx, [[1140, 1290], [ax + 150, 1120], [ax + 175, 1210], [1140, 1460]], { fill: K.C.shirt, w: 3, seed: 760 });
      K.shape(ctx, [[ax + 80, 1125], [ax - 10, 1112], [ax - 34, 1128], [ax - 10, 1146], [ax + 40, 1190], [ax + 80, 1200]], { fill: K.C.skinA, w: 3, seed: 770 });
      K.label(ctx, "3 · SAME GLASS OF CHAI");
    }

    function rainyBg(t) { bokeh(t, 12); K.rain(ctx, t); }

    function arjunClose(t) {
      rainyBg(t);
      const z = 1 + 0.03 * (t - 11.2);
      K.faceClose(ctx, 540, 960, 300 * z, { who: "arjun", wide: 1.3, brow: 1, smile: "o", blink: blinkAt(t, [12.1]), drip: true, t });
      K.label(ctx, "4 · HE FREEZES");
    }

    function meeraClose(t) {
      rainyBg(t);
      const z = 1 + 0.03 * (t - 13.4);
      K.faceClose(ctx, 540, 960, 300 * z, { who: "meera", look: 0.7, blush: true, blink: blinkAt(t, [14.5, 15.6]), t });
      for (let i = 0; i < 3; i++) { // jasmine petals drifting
        const p = ((t - 13.4) * 0.35 + i * 0.33) % 1, x = 300 - p * 160 + Math.sin(t * 2 + i) * 30, y = 520 + p * 900;
        K.shape(ctx, K.ellipsePts(x, y, 12, 7, 8), { fill: K.C.jasmine, w: 1.6, j: 1, seed: 800 + i });
      }
      K.label(ctx, "5 · SHE SMILES");
    }

    function renderAt(time) {
      const t = clamp(Math.floor(time * 12) / 12, 0, TOTAL);
      K.setBoil(Math.floor(time * 12));
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      K.paper(ctx);
      if (t < 2.6) sheet(t);
      else if (t < 8.8) wide(t);
      else if (t < 11.2) hands(t);
      else if (t < 13.4) arjunClose(t);
      else meeraClose(t);
      const fade = seg(time, 15.9, 16.4);
      if (fade > 0) { ctx.fillStyle = `rgba(244,236,220,${fade})`; ctx.fillRect(0, 0, 1080, 1920); }
      if (window.__showSafe) { ctx.strokeStyle = "#0a0"; ctx.lineWidth = 3; ctx.setLineDash([14, 10]); ctx.strokeRect(60, 250, 900, 1250); ctx.setLineDash([]); }
      ctx.restore();
    }
    window.renderAt = renderAt;
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    const q = new URLSearchParams(location.search); window.__showSafe = q.has("safe");
    renderAt(q.has("t") ? parseFloat(q.get("t")) : 0);
  })();
  </script>
</body>
</html>
