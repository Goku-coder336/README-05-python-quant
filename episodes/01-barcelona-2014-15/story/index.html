<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="data/mocap.js"></script>
    <script src="assets/story.js"></script>
    <script src="assets/mo.js"></script>
    <script src="assets/goal1.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #146a66; }
      #root { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #fff; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, #1f8e86 0%, #146a66 55%, #0a3a3d 100%); }
      .tag { position: absolute; transform: translate(-50%, -100%); font: 700 28px Inter, sans-serif; padding: 6px 18px; border-radius: 22px;
             background: rgba(4,32,36,.88); border: 3px solid #ff3b55; white-space: nowrap; }
      .recon { position: absolute; left: 60px; top: 48px; font: 700 28px Inter, sans-serif; padding: 8px 18px; border: 3px solid #ff3b55; border-radius: 8px; background: rgba(4,32,36,.6); }
      .src { position: absolute; left: 62px; top: 112px; font: 400 28px Inter, sans-serif; color: rgba(255,255,255,.8); }
      .score { position: absolute; right: 60px; top: 44px; font: 700 46px Oswald, sans-serif; background: rgba(4,32,36,.85); padding: 6px 20px; border-radius: 10px; }
      .cap { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; }
      .cap span { display: inline-block; font: 600 40px Inter, sans-serif; background: rgba(4,32,36,.8); padding: 8px 24px; border-radius: 10px; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="bg"></div>
      <svg id="pitch" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0"></svg>
      <div id="tags"></div>
      <div id="flash" class="flash"></div>
      <div class="recon">Reconstruction · positions and movement illustrative</div>
      <div class="src">Data: StatsBomb open data · Motion: CMU motion capture</div>
      <div id="score" class="score" style="opacity:0">JUV 0-1 BAR · 4'</div>
      <div id="cap1" class="cap clip" data-start="0.65" data-duration="2.35" data-track-index="2"><span>Iniesta found Rakitić.</span></div>
      <div id="cap2" class="cap clip" data-start="3.75" data-duration="2.2" data-track-index="2"><span>One-nil.</span></div>
      <audio id="mix" class="clip" src="assets/audio/test_mix.wav" data-start="0" data-duration="8" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const svg = document.getElementById("pitch"), tags = document.getElementById("tags");
      const state = { t: 0 };
      const draw = () => GOAL1.render(state.t, svg, tags);
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 8, duration: 8, ease: "none", onUpdate: draw }, 0);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.06 }, 3.42);
      tl.to("#flash", { opacity: 0, duration: 0.4 }, 3.48);
      tl.fromTo("#score", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 3.5);
      draw();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
