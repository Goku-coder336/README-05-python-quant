<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/players.js"></script>
    <script src="assets/flat.js"></script>
    <script src="assets/qf_suarez.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a8079; }
      #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: Inter, sans-serif; }
      .bg { position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 45%, #23a096 0%, #1a8079 55%, #0d4a48 100%); }
      .streak { position: absolute; height: 150px; background: rgba(6,48,50,.33); border-radius: 75px; transform: rotate(-28deg); }
      #stage { position: absolute; inset: 0; transform-origin: 50% 65%; }
      .title { position: absolute; left: 120px; right: 192px; top: 312px; text-align: center; }
      .title div { font: 700 92px/1.02 Oswald, sans-serif; letter-spacing: .01em; text-shadow: 0 6px 0 rgba(6,40,42,.55); }
      .pill { position: absolute; left: 120px; right: 192px; top: 560px; text-align: center; }
      .pill span { display: inline-block; font: 700 52px Oswald, sans-serif; letter-spacing: .04em; background: #14181b; padding: 6px 26px; border-radius: 12px; border: 4px solid #ffd166; color: #ffd166; }
      .reveal { position: absolute; left: 120px; right: 192px; top: 320px; text-align: center; }
      .reveal .n { font: 700 170px/1 Oswald, sans-serif; color: #d6f53a; text-shadow: 0 8px 0 rgba(6,40,42,.6); }
      .reveal .s { font: 700 40px Oswald, sans-serif; letter-spacing: .1em; margin-top: 10px; }
      .cap { position: absolute; left: 120px; right: 260px; top: 1090px; text-align: center; }
      .cap span { display: inline-block; font: 800 38px/1.2 Inter, sans-serif; background: rgba(10,30,32,.82); padding: 10px 24px; border-radius: 14px; }
      .lbl { position: absolute; left: 130px; top: 1200px; font: 600 26px Inter, sans-serif; background: rgba(10,30,32,.7); padding: 6px 14px; border-radius: 10px; }
      .slow { position: absolute; left: 120px; right: 192px; text-align: center; top: 660px; font: 700 30px Oswald, sans-serif; letter-spacing: .12em; color: #ffd166; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.2" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <div class="streak" style="left:-260px;top:520px;width:1000px"></div>
      <div class="streak" style="left:380px;top:1180px;width:1000px"></div>
      <div class="streak" style="left:-140px;top:1560px;width:800px"></div>
      <div id="stage"><svg id="s" data-layout-ignore width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0"></svg></div>
      <div id="flash" class="flash"></div>
      <div id="t0" class="title clip" data-start="0" data-duration="8.8" data-track-index="2"><div id="t0a">WHO DID THIS</div><div id="t0b">TO DAVID LUIZ?</div></div>
      <div id="p1" class="pill clip" data-start="0.4" data-duration="1.9" data-track-index="3"><span>THROUGH THE LEGS</span></div>
      <div id="p2" class="pill clip" data-start="3.4" data-duration="1.7" data-track-index="3"><span>AND AGAIN</span></div>
      <div id="sl1" class="slow clip" data-start="0.34" data-duration="1.86" data-track-index="4">SLOW MOTION</div>
      <div id="sl2" class="slow clip" data-start="3.35" data-duration="1.65" data-track-index="4">SLOW MOTION</div>
      <div id="rv" class="reveal clip" data-start="8.8" data-duration="2.4" data-track-index="2"><div class="n">SUÁREZ</div><div class="s">QUARTER-FINAL · PARIS · 2014/15</div></div>
      <div id="c1" class="cap clip" data-start="9.0" data-duration="2.2" data-track-index="5"><span>Suárez scored twice that night.</span></div>
      <div id="lb" class="lbl clip" data-start="0" data-duration="11.2" data-track-index="6">Recreation · based on match footage</div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="11.2" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const P = window.POSES_QF, F = window.FLAT, PL = window.PLAYERS;
      const ROLE = { 1: PL["Suárez"], 2: PL["David Luiz"] };
      // time ramp: [source frame from, to, speed]; slow motion on both nutmegs and the shot
      const SEG = [[0, 10, 1], [10, 32, 0.4], [32, 66, 1], [66, 88, 0.45], [88, 136, 1], [136, 146, 0.4], [146, 178, 0.6]];
      function srcFrame(t) {
        let acc = 0;
        for (const [a, b, sp] of SEG) {
          const d = (b - a) / (P.fps * sp);
          if (t < acc + d) return a + (t - acc) * P.fps * sp;
          acc += d;
        }
        return 178;
      }
      const svg = document.getElementById("s");
      function draw(t) {
        const fr = Math.min(P.n - 1.001, srcFrame(t)), i = Math.floor(fr), u = fr - i, j = Math.min(P.n - 1, i + 1);
        const k = 0.8, ox = (1080 - P.w * k) / 2 - 20, oy = 300;
        const items = [];
        for (const tr of P.tracks) {
          const A = tr.K[i], B = tr.K[j] || A;
          if (!A) continue;
          const C = tr.C[i];
          if (C.filter((c) => c > 0.3).length < 11) continue; // too little of this player in shot to draw
          const K = A.map((p, q) => [ox + (p[0] + (B[q][0] - p[0]) * u) * k, oy + (p[1] + (B[q][1] - p[1]) * u) * k]);
          const base = ROLE[tr.id] || { skin: "#d29b77", hairCol: "#1a120c" };
          const T = Object.assign({}, base, { kit: tr.team === "BARA" ? "BARA" : (tr.team === "REF" ? "REF" : "PSG") });
          items.push(F.player(K, C, T));
        }
        items.sort((a, b) => a.foot - b.foot);
        let o = items.map((x) => x.svg).join("");
        const bb = P.ball[i];
        if (bb) o += F.ball(ox + bb[0] * k, oy + bb[1] * k, Math.max(14, bb[2] * k * 0.8));
        svg.innerHTML = o;
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 11.2, duration: 11.2, ease: "none", onUpdate: () => draw(state.t) }, 0);
      tl.set("#flash", { opacity: 0 }, 0);
      // camera: a slow push, a punch-in on each slow-motion beat
      tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.06, duration: 11.2, ease: "none" }, 0);
      for (const [t, d] of [[0.34, 1.86], [3.35, 1.65], [6.62, 0.84]]) {
        tl.to("#stage", { scale: "+=0.08", duration: 0.25, ease: "power3.out" }, t);
        tl.to("#stage", { scale: "-=0.08", duration: 0.4, ease: "power2.inOut" }, t + d - 0.2);
      }
      tl.fromTo("#t0a", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.0);
      tl.fromTo("#t0b", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.12);
      tl.to("#t0", { scale: 0.92, opacity: 0, duration: 0.2 }, 8.6);
      for (const s of ["#p1", "#p2"]) tl.fromTo(s + " span", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power4.out" }, s === "#p1" ? 0.42 : 3.42);
      tl.fromTo("#rv .n", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 8.82);
      tl.fromTo("#rv .s", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 9.1);
      for (const t of [0.34, 3.35, 7.05, 8.8]) {
        tl.fromTo("#flash", { opacity: 0.45 }, { opacity: 0, duration: 0.3, immediateRender: false }, t);
      }
      tl.fromTo("#root", { x: -12 }, { x: 0, duration: 0.3, ease: "elastic.out(1,0.3)", immediateRender: false }, 8.82);
      draw(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
