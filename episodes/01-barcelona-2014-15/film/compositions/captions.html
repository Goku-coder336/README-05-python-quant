<div id="cap-150" class="clip capg" data-start="345.06" data-duration="1.741"><span id="cap-150-t">two hundred and ninety events,</span></div>
<div id="cap-151" class="clip capg" data-start="346.801" data-duration="1.817"><span id="cap-151-t">seventy-one of them passes.</span></div>
<div id="cap-152" class="clip capg" data-start="349.462" data-duration="1.349"><span id="cap-152-t">And the player who set up</span></div>
<div id="cap-153" class="clip capg" data-start="350.811" data-duration="2.271"><span id="cap-153-t">the most shots was Rakitić, with four.</span></div>
<div id="cap-154" class="clip capg" data-start="355.311" data-duration="1.224"><span id="cap-154-t">So, the whole run.</span></div>
<div id="cap-155" class="clip capg" data-start="356.535" data-duration="1.869"><span id="cap-155-t">Thirteen games. Eleven wins.</span></div>
<div id="cap-156" class="clip capg" data-start="358.404" data-duration="2.427"><span id="cap-156-t">Two defeats, both away from home.</span></div>
<div id="cap-157" class="clip capg" data-start="361.749" data-duration="2.8"><span id="cap-157-t">Thirty-one goals scored. Eleven conceded.</span></div>
<div id="cap-158" class="clip capg" data-start="365.17" data-duration="1.617"><span id="cap-158-t">They won every home game,</span></div>
<div id="cap-159" class="clip capg" data-start="366.787" data-duration="0.996"><span id="cap-159-t">six out of six.</span></div>
<div id="cap-160" class="clip capg" data-start="367.783" data-duration="1.866"><span id="cap-160-t">Both defeats were by a single</span></div>
<div id="cap-161" class="clip capg" data-start="369.649" data-duration="1.617"><span id="cap-161-t">goal: three-two in Paris,</span></div>
<div id="cap-162" class="clip capg" data-start="371.266" data-duration="1.544"><span id="cap-162-t">three-two in Munich.</span></div>
<div id="cap-163" class="clip capg" data-start="373.734" data-duration="0.934"><span id="cap-163-t">In the group,</span></div>
<div id="cap-164" class="clip capg" data-start="374.668" data-duration="1.335"><span id="cap-164-t">Messi scored eight.</span></div>
<div id="cap-165" class="clip capg" data-start="376.003" data-duration="1.201"><span id="cap-165-t">In the knockouts,</span></div>
<div id="cap-166" class="clip capg" data-start="377.204" data-duration="2.469"><span id="cap-166-t">two. Neymar and Suárez scored twelve</span></div>
<div id="cap-167" class="clip capg" data-start="379.673" data-duration="1.301"><span id="cap-167-t">of the sixteen.</span></div>
<div id="cap-168" class="clip capg" data-start="381.892" data-duration="2.332"><span id="cap-168-t">Messi still finished joint top scorer,</span></div>
<div id="cap-169" class="clip capg" data-start="384.224" data-duration="0.837"><span id="cap-169-t">on ten goals,</span></div>
<div id="cap-170" class="clip capg" data-start="385.061" data-duration="2.691"><span id="cap-170-t">level with Neymar and Cristiano Ronaldo.</span></div>
<div id="cap-171" class="clip capg" data-start="388.608" data-duration="1.84"><span id="cap-171-t">So, case closed? Not quite.</span></div>
<div id="cap-172" class="clip capg" data-start="391.581" data-duration="1.629"><span id="cap-172-t">It was Barcelona's second treble,</span></div>
<div id="cap-173" class="clip capg" data-start="393.21" data-duration="1.581"><span id="cap-173-t">and they were the first European</span></div>
<div id="cap-174" class="clip capg" data-start="394.791" data-duration="1.69"><span id="cap-174-t">club to win the treble twice.</span></div>
<div id="cap-175" class="clip capg" data-start="397.434" data-duration="2.21"><span id="cap-175-t">Luis Enrique called it a transitional</span></div>
<div id="cap-176" class="clip capg" data-start="399.644" data-duration="1.337"><span id="cap-176-t">year. Ten years later,</span></div>
<div id="cap-177" class="clip capg" data-start="400.981" data-duration="1.803"><span id="cap-177-t">he won this competition again,</span></div>
<div id="cap-178" class="clip capg" data-start="402.784" data-duration="1.511"><span id="cap-178-t">with Paris Saint-Germain,</span></div>
<div id="cap-179" class="clip capg" data-start="404.295" data-duration="2.859"><span id="cap-179-t">in twenty twenty-five and twenty twenty-six.</span></div>
<div id="cap-180" class="clip capg" data-start="408.048" data-duration="1.166"><span id="cap-180-t">So the goals moved,</span></div>
<div id="cap-181" class="clip capg" data-start="409.214" data-duration="1.517"><span id="cap-181-t">and Barcelona won anyway.</span></div>
<div id="cap-182" class="clip capg" data-start="410.731" data-duration="1.749"><span id="cap-182-t">Was this the best front three</span></div>
<div id="cap-183" class="clip capg" data-start="412.48" data-duration="1.808"><span id="cap-183-t">the Champions League has seen?</span></div>
<div id="cap-184" class="clip capg" data-start="414.288" data-duration="1.7"><span id="cap-184-t">Tell me in the comments.</span></div>
