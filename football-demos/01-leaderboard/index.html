html, body { width:1080px; height:1920px; overflow:hidden; background:#090a0c; }

#board { position:absolute; inset:0; transform-origin:50% 45%; }

#total { position:absolute; right:70px; top:42px; height:150px; display:flex; color:#fff; font-weight:700; font-size:150px; line-height:150px; transform-origin:100% 50%; }
.reel { width:78px; height:150px; overflow:hidden; text-align:center; }
.rstrip span { display:block; height:150px; }
.comma { width:30px; }
#sweep { position:absolute; top:0; bottom:0; width:220px; background:linear-gradient(90deg,transparent,rgba(207,255,58,0.35),transparent); transform:translateX(-400px); }
.row { position:absolute; left:80px; right:80px; height:160px; border-radius:30px; border:3px solid #cfff3a;

.row .glow { position:absolute; inset:-3px; border-radius:30px; box-shadow:0 0 26px rgba(207,255,58,0.4); pointer-events:none; }
.badge { width:74px; height:74px; border-radius:50%; background:#3a4048; color:#fff; font-weight:700; font-size:46px; overflow:hidden; flex:none; }
.badge .strip span { display:flex; height:90px; margin-top:-8px; align-items:center; justify-content:center; height:74px; margin:0 0 16px; }
.row.lead .badge { background:#cfff3a; color:#0e1114; }
.disc { width:100px; height:100px; border-radius:50%; color:#fff; font-weight:700; font-size:44px; display:flex; align-items:center; justify-content:center; border:4px solid #3a4048; flex:none; }
.row.lead .disc { border-color:#cfff3a; }
.name { color:#fff; font-weight:700; font-size:66px; letter-spacing:0.02em; flex:1; }
.score { color:#fff; font-weight:700; font-size:96px; display:flex; align-items:baseline; gap:12px; }
.score span { display:inline-block; width:100px; text-align:right; }
.score small { color:#8f969e; font-size:28px; font-weight:600; letter-spacing:0.12em; }
